<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thème Littéraire | Concours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- En-tête fusionné avec les onglets -->
    <header>
        <div class="header-left">
            <h1>Thème Littéraire</h1>
        </div>
        <div class="tabs-container">
            <button class="tab-btn active" data-target="tab-traduction">Traduction</button>
            <button class="tab-btn" data-target="tab-correction">Correction</button>
            <button class="tab-btn" data-target="tab-anki">Cartes Anki</button>
        </div>
        <div class="header-right">
            <button id="btn-settings" class="icon-btn" title="Réglages">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
        </div>
    </header>

    <main id="main-content">
        <!-- Onglet 1 : Traduction (Design épuré et immersif) -->
        <section id="tab-traduction" class="tab-pane active">
            <div class="trad-container fade-in">
                
                <div class="sentence-hero elegant-shadow">      
                    <div class="sentence-content">
                        <p id="source-text" class="literary-text-large">Prêt pour votre thème littéraire ?</p>
                        <span id="source-author" class="author-text-elegant">Cliquez sur générer pour commencer.</span>
                    </div>

                    <div class="separator"></div>

                    <textarea id="user-translation" placeholder="Votre traduction en anglais..." rows="2"></textarea>
                </div>
                
                <div class="trad-actions">
                    <button id="btn-generate" class="secondary-btn">Générer une phrase</button>
                    <button id="btn-correct" class="primary-btn glow-btn">Corriger</button>
                </div>
            </div>
        </section>

        <!-- Onglet 2 : Correction -->
        <section id="tab-correction" class="tab-pane">
            <div id="correction-loader" class="loader-overlay hidden">
                <div class="spinner"></div>
                <p>Analyse de la traduction en cours...</p>
            </div>
            
            <div class="correction-grid">
                <!-- Colonne de gauche (Textes) -->
                <div class="col-left">
                    <div class="phrase-block elegant-shadow fade-up" style="animation-delay: 0.1s;">
                        <h3>Phrase source</h3>
                        <p id="corr-source" class="literary-text"></p>
                    </div>
                    <div class="phrase-block elegant-shadow fade-up" style="animation-delay: 0.2s;">
                        <h3>Votre traduction</h3>
                        <p id="corr-user" class="mono-text"></p>
                    </div>
                    
                    <!-- Bloc de traduction idéale avec les boutons d'action intégrés -->
                    <div class="phrase-block highlight-block elegant-shadow fade-up" style="animation-delay: 0.3s;">
                        <div class="ideal-header">
                            <h3>Traduction idéale</h3>
                            <div class="context-actions">
                                <button id="btn-explain-action" class="circle-btn" disabled title="Expliquer la sélection">?</button>
                                <button id="btn-anki-action" class="circle-btn" disabled title="Créer une carte Anki">A</button>
                            </div>
                        </div>
                        <p id="corr-ideal" class="literary-text text-primary"></p>
                    </div>
                </div>
                
                <!-- Colonne de droite (Explications) -->
                <div class="col-right" id="corr-explanations">
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3; margin-bottom:1rem;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <p>La correction détaillée apparaîtra ici.</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Onglet 3 : Anki -->
        <section id="tab-anki" class="tab-pane">
            <div class="anki-container" id="anki-content">
                <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3; margin-bottom:1rem;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                    <p>Aucune carte générée pour le moment.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Modale Réglages -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content fade-in">
            <h2>Configuration</h2>
            <div class="form-group">
                <label for="api-key-input">Clé API Google Gemini</label>
                <input type="password" id="api-key-input" placeholder="AIzaSy...">
            </div>
            <div class="form-group">
                <label for="model-select">Modèle</label>
                <select id="model-select">
                    <option value="gemini-3-flash-preview">Gemini 3 Flash (Preview)</option>
                    <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
                    <option value="gemini-1.5-flash-latest">Gemini 1.5 Flash</option>
                    <option value="gemini-1.5-pro-latest">Gemini 1.5 Pro</option>
                </select>
            </div>
            <div class="modal-actions">
                <button id="btn-close-settings" class="secondary-btn">Fermer</button>
                <button id="btn-save-settings" class="primary-btn">Enregistrer</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="script.js"></script>
</body>
</html>
